apiVersion: apps/v1
kind: Deployment
metadata:
  name: featherstore
  namespace: featherstore
  labels:
    app.kubernetes.io/name: featherstore
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: featherstore
  template:
    metadata:
      labels:
        app.kubernetes.io/name: featherstore
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: featherstore
          image: ghcr.io/OWNER/featherstore:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: FEATHERSTORE_BIND_ADDR
              value: 0.0.0.0:8080
            - name: FEATHERSTORE_LOG_FORMAT
              value: json
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
