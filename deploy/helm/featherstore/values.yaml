replicaCount: 1

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/OWNER/featherstore
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

server:
  port: 8080
  logFormat: json
  maxRequestBytes: 16777216
  snapshot:
    enabled: false
    mountPath: /data
    path: /data/featherstore.snapshot
    persist: false
    loadOnStart: false
    persistence:
      enabled: false
      storageClassName: ""
      accessModes: ["ReadWriteOnce"]
      size: 1Gi

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    interval: 15s
    additionalLabels: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

nodeSelector: {}
tolerations: []
affinity: {}
