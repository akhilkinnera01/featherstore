site_name: Featherstore
site_description: Experimental Rust + Python feature store MVP for synthetic recommendation workloads.
repo_name: featherstore
repo_url: https://github.com/OWNER/featherstore
strict: true
nav:
  - Home: index.md
  - Install: install.md
  - Quickstart: quickstart.md
  - Concepts and architecture: concepts.md
  - Server API: server-api.md
  - Python SDK: python-sdk.md
  - Demo notebook: demo-notebook.md
  - Kubernetes and Helm: operations/kubernetes.md
  - Observability: operations/observability.md
  - Benchmarking: operations/benchmark.md
  - Limitations: limitations.md
  - Contributing and release notes: contributing.md
  - Architecture source notes: architecture/ARCHITECTURE.md
theme:
  name: mkdocs
  navigation_depth: 3
markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
