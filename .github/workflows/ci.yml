name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.81'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python:
    name: Python SDK tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ./python[dev]
      - run: pytest python/tests

  docker:
    name: Docker image build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build local image
        run: docker build -t featherstore:ci .

  helm:
    name: Helm lint/template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint deploy/helm/featherstore
      - name: Template default chart
        run: helm template featherstore deploy/helm/featherstore --namespace featherstore
      - name: Template ServiceMonitor/PVC/HPA options
        run: |
          helm template featherstore deploy/helm/featherstore \
            --namespace featherstore \
            --set metrics.serviceMonitor.enabled=true \
            --set server.snapshot.enabled=true \
            --set server.snapshot.persistence.enabled=true \
            --set autoscaling.enabled=true

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Verify required operations docs exist
        run: |
          test -s README.md
          test -s docs/operations/kubernetes.md
          test -s docs/operations/observability.md
          test -s docs/operations/release.md
          test -s docs/operations/benchmark.md
          test -s deploy/grafana/featherstore-dashboard.json
      - name: Build MkDocs site
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs
          mkdocs build --strict

  benchmark-smoke:
    name: Benchmark smoke (not proof)
    runs-on: ubuntu-latest
    needs: [rust, python]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.81'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ./python[dev]
      - name: Start release server
        run: |
          cargo run -p featherstore-server --release > /tmp/featherstore.log 2>&1 &
          echo $! > /tmp/featherstore.pid
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8080/healthz && exit 0
            sleep 1
          done
          cat /tmp/featherstore.log
          exit 1
      - name: Load synthetic rows
        run: featherstore-load-synthetic --server http://127.0.0.1:8080 --users 100 --items 100 --contexts 10 --embedding-dims 4 --batch-size 100
      - name: Run short benchmark smoke
        run: |
          featherstore-benchmark \
            --server http://127.0.0.1:8080 \
            --scenario single_get_request_qps \
            --duration 2 \
            --warmup 1 \
            --concurrency 4 \
            --target-qps 100 \
            --users 100 \
            --items 100 \
            --contexts 10 \
            --embedding-dims 4 \
            --output benchmark-smoke.json
          python - <<'PY'
          import json
          data=json.load(open('benchmark-smoke.json'))
          assert data['status'] in {'proven','not_proven'}
          assert data['target_qps'] == 100
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke
          path: benchmark-smoke.json
