[workspace]
members = ["crates/featherstore", "crates/featherstore-server"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/OWNER/featherstore"
rust-version = "1.78"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["macros"] }
bincode = "1.3"
bytes = "1"
http = "1"
parking_lot = { version = "0.12", features = ["serde"] }
prometheus = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
